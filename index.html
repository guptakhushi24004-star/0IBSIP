
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Temperature Converter</h1>
        <p class="subtitle">Convert temperatures easily</p>

        <div class="converter-box">

            <label for="temperature">Enter Temperature</label>
            <input
                type="text"
                id="temperature"
                placeholder="Enter temperature"
                inputmode="decimal"
            >

            <label for="unit">Select Input Unit</label>
            <select id="unit">
                <option value="Celsius">Celsius (°C)</option>
                <option value="Fahrenheit">Fahrenheit (°F)</option>
                <option value="Kelvin">Kelvin (K)</option>
            </select>

            <button id="convertBtn">Convert Temperature</button>

            <p id="error" class="error"></p>

            <div id="result" class="result" aria-live="polite">
                <h2>Converted Results</h2>
                <p>Celsius: <span id="celsius">--</span></p>
                <p>Fahrenheit: <span id="fahrenheit">--</span></p>
                <p>Kelvin: <span id="kelvin">--</span></p>
            </div>

        </div>

        <footer>
            <p>Temperature Converter | OASIS INFOBYTE</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
